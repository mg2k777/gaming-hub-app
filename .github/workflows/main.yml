name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Dependencias
        run: |
          npm install
          npm run build

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inicializar Capacitor e Android
        run: |
          npx cap init "Gaming Hub" "com.nexus.gaminghub" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Compilar Ficheiro APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar Ficheiro APK
        uses: actions/upload-artifact@v3
        with:
          name: GamingHub-Installer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

